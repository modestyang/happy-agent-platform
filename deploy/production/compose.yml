name: happy-agent

services:
  postgres:
    image: happy-agent-postgres:${RELEASE_ID}
    environment:
      POSTGRES_DB: happy_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      FITNESS_DB_PASSWORD_FILE: /run/secrets/fitness_db_password
      AGENT_DB_PASSWORD_FILE: /run/secrets/agent_db_password
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
    volumes:
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/data/postgres
        target: /var/lib/postgresql/data
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/release/current/postgres/init-roles.sh
        target: /docker-entrypoint-initdb.d/00-init-roles.sh
        read_only: true
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/release/current/postgres/init-roles.sql
        target: /usr/local/share/happy-agent-init-roles.sql
        read_only: true
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/release/current/postgres/enforce-isolation.sql
        target: /usr/local/share/happy-agent-enforce-isolation.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    secrets:
      - postgres_password
      - fitness_db_password
      - agent_db_password

  app:
    image: ${APP_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FITNESS_DB_PASSWORD_FILE: /run/secrets/fitness_db_password
      AGENT_DB_PASSWORD_FILE: /run/secrets/agent_db_password
      HAPPY_AGENT_MASTER_KEY_FILE: /run/secrets/agent-master-key
    volumes:
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/media
        target: /app/deploy/.local/media
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/secrets/agent-master-key
        target: /run/secrets/agent-master-key
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/app/bootstrap HTTP/1.1\r\nHost: localhost\r\nCookie: FITNESS_SESSION=invalid-healthcheck-session\r\nConnection: close\r\n\r\n" >&3; IFS= read -r status <&3; case "$$status" in *" 401 "*) exit 0 ;; *) exit 1 ;; esac'
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1800m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    secrets:
      - fitness_db_password
      - agent_db_password

  nginx:
    image: ${WEB_IMAGE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/release/current/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/acme-webroot
        target: /var/www/acme
        read_only: true
      - type: bind
        source: ${HAPPY_AGENT_ROOT:-/opt/happy-agent}/certificates
        target: /etc/letsencrypt
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-${HAPPY_AGENT_ROOT:-/opt/happy-agent}/secrets/postgres-password}
  fitness_db_password:
    file: ${FITNESS_DB_PASSWORD_FILE:-${HAPPY_AGENT_ROOT:-/opt/happy-agent}/secrets/fitness-db-password}
  agent_db_password:
    file: ${AGENT_DB_PASSWORD_FILE:-${HAPPY_AGENT_ROOT:-/opt/happy-agent}/secrets/agent-db-password}
